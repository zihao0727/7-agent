stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

default:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]

validate:
  stage: validate
  image: python:3.13-slim
  script:
    - python -m compileall -q backend agent main.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$BACKEND_IMAGE:$TAG" -t "$BACKEND_IMAGE:latest" -f Dockerfile .
    - docker build --pull -t "$FRONTEND_IMAGE:$TAG" -t "$FRONTEND_IMAGE:latest" frontend
    - docker push "$BACKEND_IMAGE:$TAG"
    - docker push "$BACKEND_IMAGE:latest"
    - docker push "$FRONTEND_IMAGE:$TAG"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy:
  stage: deploy
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker compose -f docker-compose.server.yml pull
    - docker compose -f docker-compose.server.yml up -d --remove-orphans
  environment:
    name: production
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
