services:
  api:
    image: ${BACKEND_IMAGE:-wy-agent-backend}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      APP_ENV: production
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env.server}
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: agent7
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: agent7
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.server}
      MYSQL_DATABASE: agent7
      REDIS_URL: redis://redis:6379/0
      LARK_EXECUTION_MODE: client
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-6868}:6868"
    volumes:
      - agent7_data:/app/data

  web:
    image: ${FRONTEND_IMAGE:-wy-agent-frontend}:${IMAGE_TAG:-latest}
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env.server}
        NEXT_PUBLIC_DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
        NEXT_PUBLIC_KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
        NEXT_PUBLIC_SEVNX_MODEL: ${SEVNX_MODEL:-gpt-5.5}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-7878}:7878"

  mongo:
    image: mongo:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mongo_data:/data/db

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.server}
      MYSQL_DATABASE: agent7
      MYSQL_USER: agent7
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.server}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uagent7 -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data

volumes:
  agent7_data:
  mongo_data:
  mysql_data:
  redis_data:
